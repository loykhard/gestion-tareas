<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tareas UTP</title>

    <link rel="stylesheet" href="css/styles.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <main class="contenedor">

        <header class="encabezado">
            <div>
                <h1>Gestión de Tareas UTP</h1>
                <p>Organiza tus actividades diarias de manera rápida y sencilla.</p>
            </div>

            <button id="modoOscuro" class="btn-modo" type="button">
                🌙
            </button>
        </header>

        <section class="formulario-tarea">
            <label for="inputTarea">Nueva tarea</label>

            <div class="grupo-input">
                <input type="text" id="inputTarea" placeholder="Escribe una nueva tarea..." autocomplete="off" required>

                <button id="btnAgregar" type="button">
                    Agregar tarea
                </button>
            </div>
        </section>

        <section class="busqueda">
            <label for="buscarTarea">Buscar tarea</label>

            <input type="text" id="buscarTarea" placeholder="Buscar tarea..." autocomplete="off">
        </section>

        <section class="resumen">
            <article>
                <h3>Total</h3>
                <span id="totalTareas">0</span>
            </article>

            <article>
                <h3>Completadas</h3>
                <span id="tareasCompletadas">0</span>
            </article>

            <article>
                <h3>Pendientes</h3>
                <span id="tareasPendientes">0</span>
            </article>
        </section>

        <section class="progreso-tareas">
            <p>Progreso de tareas</p>
            <progress id="progreso" value="0" max="100"></progress>
        </section>

        <section class="lista-tareas">
            <div class="titulo-lista">
                <h2>Lista de tareas</h2>

                <button id="btnLimpiar" type="button">
                    Eliminar todas
                </button>
            </div>

            <p id="mensajeVacio">No hay tareas registradas aún.</p>

            <ul id="listaTareas"></ul>
        </section>

    </main>

    <script src="js/app.js"></script>
</body>

</html>
